<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高雄熱門服飾店地圖地標導覽 | Kaohsiung Apparel Map</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts Inter & Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans TC', 'Inter', sans-serif;
        }
        /* Custom Leaflet Map styling */
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .leaflet-popup-content-wrapper {
            padding: 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .leaflet-popup-content {
            margin: 0;
            width: 280px !important;
        }
        .leaflet-popup-tip {
            background: white;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- Sidebar / Control Panel -->
    <aside class="w-full md:w-[420px] lg:w-[460px] bg-white flex flex-col h-1/2 md:h-full z-20 shadow-xl border-r border-slate-200">
        
        <!-- Header -->
        <div class="p-5 bg-gradient-to-r from-slate-900 to-indigo-950 text-white flex-shrink-0">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-indigo-500/20 flex items-center justify-center border border-indigo-400/30 text-indigo-300">
                        <i class="fa-solid fa-shirt text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold tracking-tight text-white">高雄服飾潮店地圖</h1>
                        <p class="text-xs text-indigo-200/80">Kaohsiung Apparel & Fashion Guide</p>
                    </div>
                </div>
                <button id="resetViewBtn" title="重置地圖視角" class="px-3 py-1.5 text-xs bg-white/10 hover:bg-white/20 text-white rounded-lg transition-all flex items-center gap-1 border border-white/10">
                    <i class="fa-solid fa-location-crosshairs"></i> 全景
                </button>
            </div>
            
            <!-- Real-time Stats Cards -->
            <div class="grid grid-cols-3 gap-2 mt-4">
                <div class="bg-white/10 backdrop-blur-md p-2.5 rounded-lg border border-white/10 text-center">
                    <div class="text-xs text-slate-300">總收錄</div>
                    <div id="statTotal" class="text-lg font-bold text-white">0</div>
                </div>
                <div class="bg-white/10 backdrop-blur-md p-2.5 rounded-lg border border-white/10 text-center">
                    <div class="text-xs text-slate-300">目前篩選</div>
                    <div id="statFiltered" class="text-lg font-bold text-indigo-300">0</div>
                </div>
                <div class="bg-white/10 backdrop-blur-md p-2.5 rounded-lg border border-white/10 text-center">
                    <div class="text-xs text-slate-300">營業中</div>
                    <div id="statOpen" class="text-lg font-bold text-emerald-400">0</div>
                </div>
            </div>
        </div>

        <!-- Search & Filters Container -->
        <div class="p-4 bg-slate-50 border-b border-slate-200 space-y-3 flex-shrink-0">
            
            <!-- Search Box -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" placeholder="搜尋店名、風格標籤或地址..." 
                    class="w-full pl-10 pr-4 py-2 bg-white text-slate-800 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all shadow-sm">
            </div>

            <!-- Open Now Toggle Filter -->
            <div class="flex items-center justify-between px-1">
                <span class="text-xs font-medium text-slate-600 flex items-center gap-1.5">
                    <i class="fa-regular fa-clock text-slate-400"></i> 只顯示營業中店家
                </span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="openOnlyToggle" class="sr-only peer">
                    <div class="w-9 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div>
                </label>
            </div>

            <!-- Category Chips -->
            <div class="flex items-center gap-1.5 overflow-x-auto pb-1 pt-1 no-scrollbar text-xs" id="categoryChips">
                <!-- Dynamic Chips JS populated -->
            </div>
        </div>

        <!-- Store List Scroll Area -->
        <div class="flex-1 overflow-y-auto p-4 space-y-3" id="storeList">
            <!-- Dynamic Store Items inserted here -->
        </div>

        <!-- Footer -->
        <div class="p-3 bg-slate-50 border-t border-slate-200 text-center text-xs text-slate-500 flex-shrink-0">
            高雄服飾選品地圖 &copy; 2026 Kaohsiung Shops Guide
        </div>
    </aside>

    <!-- Map Container -->
    <main class="flex-1 h-1/2 md:h-full relative">
        <div id="map"></div>
    </main>

    <script>
        // Store Data Array
        const storesData = [
            {
                id: 1,
                name: "INVINCIBLE South",
                lat: 22.6225,
                lng: 120.3015,
                address: "高雄市新興區仁智街285號",
                category: "潮流選品",
                tags: ["潮流選品", "限量球鞋", "經典潮牌"],
                openTime: "14:00",
                closeTime: "22:00",
                desc: "台灣指標性潮流選貨店，引進日本及歐美頂尖潮流品牌與限量球鞋。"
            },
            {
                id: 2,
                name: "WODEN 高雄門市",
                lat: 22.6228,
                lng: 120.3016,
                address: "高雄市新興區仁智街237號",
                category: "街頭潮流",
                tags: ["街頭潮流", "戶外生活", "台灣品牌"],
                openTime: "14:00",
                closeTime: "22:00",
                desc: "台灣在地潮流品牌，集結美式街頭服飾、飾品配件與露營戶外用品。"
            },
            {
                id: 3,
                name: "3 POINTER 高雄店",
                lat: 22.6226,
                lng: 120.3015,
                address: "高雄市新興區仁智街259號",
                category: "街頭選品",
                tags: ["街頭選品", "台灣獨立品牌", "穿搭選貨"],
                openTime: "14:00",
                closeTime: "22:00",
                desc: "精選多個台灣在地原創潮流品牌與設計師服飾，穿搭風格鮮明。"
            },
            {
                id: 4,
                name: "INNOCENT HOOD",
                lat: 22.6227,
                lng: 120.3014,
                address: "高雄市新興區仁智街238號",
                category: "美式潮流",
                tags: ["美式潮流", "街頭穿搭", "新崛江商圈"],
                openTime: "14:00",
                closeTime: "22:00",
                desc: "位於新崛江商圈，主打高質感街頭潮流服飾與熱門鞋款選品。"
            },
            {
                id: 5,
                name: "虫洞 KH (Wormhole)",
                lat: 22.6210,
                lng: 120.2968,
                address: "高雄市前金區成功一路318巷43號",
                category: "復古古著",
                tags: ["復古古著", "軍工裝", "日系女裝"],
                openTime: "15:00",
                closeTime: "21:00",
                desc: "南部知名古著店，一樓主打日系女裝古著，二樓為中性軍工裝選品。"
            },
            {
                id: 6,
                name: "MoonDy 楠梓旗艦店",
                lat: 22.7275,
                lng: 120.3270,
                address: "高雄市楠梓區建楠路155號",
                category: "平價質感",
                tags: ["平價質感", "重磅素T", "涼感服飾"],
                openTime: "11:00",
                closeTime: "21:30",
                desc: "主打高CP值重磅素T、涼感服飾與質感包包飾品，深受學生族群喜愛。"
            },
            {
                id: 7,
                name: "MoonDy 玉竹門市",
                lat: 22.6242,
                lng: 120.3018,
                address: "高雄市新興區玉竹一街32號",
                category: "平價質感",
                tags: ["平價文青", "服飾配件", "真皮小皮件"],
                openTime: "13:00",
                closeTime: "21:30",
                desc: "鄰近新崛江商圈，主打簡約百搭服飾、真皮小皮件與配件選品。"
            },
            {
                id: 8,
                name: "Emily Fashion Wear",
                lat: 22.6229,
                lng: 120.3014,
                address: "高雄市新興區仁智街228號",
                category: "英倫龐克",
                tags: ["英倫龐克", "特色女裝", "設計剪裁"],
                openTime: "14:00",
                closeTime: "21:30",
                desc: "風格獨特的女性服飾選貨店，主打特殊剪裁與英倫龐克造型。"
            },
            {
                id: 9,
                name: "後驛成衣商圈",
                lat: 22.6398,
                lng: 120.3025,
                address: "高雄市三民區安寧街",
                category: "成衣商圈",
                tags: ["成衣批發", "平價多元", "南部五分埔"],
                openTime: "10:00",
                closeTime: "20:00",
                desc: "號稱「南部五分埔」，匯集數百家成衣批發店家，風格齊全且價格親民。"
            }
        ];

        // Global State Variables
        let map;
        let markers = {};
        let activeCategory = "全選";
        let openOnlyFilter = false;
        let searchQuery = "";

        // Default Map Center (Kaohsiung Center)
        const KAOHSIUNG_CENTER = [22.628, 120.305];
        const DEFAULT_ZOOM = 13;

        // Categorisation Categories for Filter Chips
        const categories = ["全選", "潮流選品", "街頭潮流", "復古古著", "平價質感", "成衣商圈"];

        // Helper: Check if store is currently open
        function isStoreOpen(openTimeStr, closeTimeStr) {
            const now = new Date();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();

            const [openH, openM] = openTimeStr.split(":").map(Number);
            const [closeH, closeM] = closeTimeStr.split(":").map(Number);

            const openMinutes = openH * 60 + openM;
            const closeMinutes = closeH * 60 + closeM;

            if (closeMinutes < openMinutes) {
                // Crosses midnight
                return currentMinutes >= openMinutes || currentMinutes <= closeMinutes;
            }
            return currentMinutes >= openMinutes && currentMinutes <= closeMinutes;
        }

        function initMap() {
            // Initialize Leaflet Map
            map = L.map('map', {
                zoomControl: false
            }).setView(KAOHSIUNG_CENTER, DEFAULT_ZOOM);

            // Add Zoom Control to Top Right
            L.control.zoom({ position: 'topright' }).addTo(map);

            // OpenStreetMap Tile Layer
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);

            // Add Markers for Stores
            storesData.forEach(store => {
                const isOpen = isStoreOpen(store.openTime, store.closeTime);
                
                // SVG Pin Icon
                const markerHtml = `
                    <div class="relative group cursor-pointer">
                        <div class="w-9 h-9 rounded-full ${isOpen ? 'bg-indigo-600' : 'bg-slate-600'} text-white flex items-center justify-center shadow-lg border-2 border-white hover:scale-110 transition-transform">
                            <i class="fa-solid fa-bag-shopping text-sm"></i>
                        </div>
                        <span class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-2 h-2 ${isOpen ? 'bg-indigo-600' : 'bg-slate-600'} rotate-45"></span>
                    </div>
                `;

                const customIcon = L.divIcon({
                    html: markerHtml,
                    className: 'custom-map-pin',
                    iconSize: [36, 36],
                    iconAnchor: [18, 36],
                    popupAnchor: [0, -32]
                });

                const marker = L.marker([store.lat, store.lng], { icon: customIcon }).addTo(map);

                // Build Popup Content
                const popupContent = `
                    <div class="p-4 font-sans">
                        <div class="flex items-center justify-between mb-2">
                            <span class="px-2 py-0.5 text-[10px] font-semibold rounded-md ${isOpen ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'}">
                                ${isOpen ? '● 營業中' : '○ 休息中'}
                            </span>
                            <span class="text-xs text-slate-500 font-medium">${store.category}</span>
                        </div>
                        <h3 class="font-bold text-slate-900 text-base mb-1">${store.name}</h3>
                        <p class="text-xs text-slate-600 mb-2 leading-relaxed">${store.desc}</p>
                        <div class="text-xs text-slate-500 space-y-1 mb-3 bg-slate-50 p-2 rounded-lg">
                            <div class="flex items-center gap-1.5"><i class="fa-regular fa-clock text-indigo-500 w-3"></i> ${store.openTime} - ${store.closeTime}</div>
                            <div class="flex items-center gap-1.5 truncate"><i class="fa-solid fa-location-dot text-indigo-500 w-3"></i> ${store.address}</div>
                        </div>
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(store.name + ' ' + store.address)}" 
                           target="_blank" 
                           class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium rounded-lg flex items-center justify-center gap-1.5 transition-colors shadow-sm">
                            <i class="fa-solid fa-diamond-turn-right"></i> 使用 Google 地圖導航
                        </a>
                    </div>
                `;

                marker.bindPopup(popupContent);
                markers[store.id] = marker;
            });
        }

        function renderCategoryChips() {
            const container = document.getElementById('categoryChips');
            container.innerHTML = categories.map(cat => `
                <button onclick="setCategory('${cat}')" 
                    class="px-3 py-1.5 rounded-full whitespace-nowrap transition-all font-medium text-xs ${
                        activeCategory === cat 
                        ? 'bg-indigo-600 text-white shadow-sm' 
                        : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'
                    }">
                    ${cat}
                </button>
            `).join('');
        }

        function setCategory(cat) {
            activeCategory = cat;
            renderCategoryChips();
            updateDisplay();
        }

        function updateDisplay() {
            const listContainer = document.getElementById('storeList');
            listContainer.innerHTML = '';

            let filteredStores = storesData.filter(store => {
                const isOpen = isStoreOpen(store.openTime, store.closeTime);

                // Category filter
                const matchesCategory = activeCategory === "全選" || store.category === activeCategory || store.tags.includes(activeCategory);

                // Open only toggle
                const matchesOpen = !openOnlyFilter || isOpen;

                // Search query
                const q = searchQuery.toLowerCase().trim();
                const matchesSearch = !q || 
                    store.name.toLowerCase().includes(q) || 
                    store.address.toLowerCase().includes(q) || 
                    store.category.toLowerCase().includes(q) ||
                    store.tags.some(t => t.toLowerCase().includes(q));

                return matchesCategory && matchesOpen && matchesSearch;
            });

            // Update Stats
            document.getElementById('statTotal').innerText = storesData.length;
            document.getElementById('statFiltered').innerText = filteredStores.length;
            document.getElementById('statOpen').innerText = storesData.filter(s => isStoreOpen(s.openTime, s.closeTime)).length;

            if (filteredStores.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-10 px-4 text-slate-400">
                        <i class="fa-solid fa-store-slash text-4xl mb-3 text-slate-300"></i>
                        <p class="text-sm font-medium">未找到符合條件的店家</p>
                        <p class="text-xs mt-1 text-slate-400">請嘗試調整搜尋關鍵字或篩選標籤</p>
                    </div>
                `;
            }

            // Render Store Cards in Sidebar
            filteredStores.forEach(store => {
                const isOpen = isStoreOpen(store.openTime, store.closeTime);

                const card = document.createElement('div');
                card.className = "p-4 bg-white rounded-xl border border-slate-200/80 shadow-sm hover:shadow-md hover:border-indigo-300 transition-all cursor-pointer group";
                
                card.innerHTML = `
                    <div class="flex items-start justify-between mb-2">
                        <h3 class="font-bold text-slate-900 group-hover:text-indigo-600 transition-colors">${store.name}</h3>
                        <span class="px-2 py-0.5 text-[10px] font-semibold rounded-md flex-shrink-0 ${isOpen ? 'bg-emerald-50 text-emerald-600 border border-emerald-200' : 'bg-slate-100 text-slate-500 border border-slate-200'}">
                            ${isOpen ? '營業中' : '休息中'}
                        </span>
                    </div>
                    
                    <p class="text-xs text-slate-500 mb-2 line-clamp-2">${store.desc}</p>
                    
                    <div class="flex flex-wrap gap-1 mb-3">
                        ${store.tags.map(tag => `<span class="px-2 py-0.5 bg-slate-100 text-slate-600 rounded text-[10px]">${tag}</span>`).join('')}
                    </div>

                    <div class="text-xs text-slate-500 space-y-1 pt-2 border-t border-slate-100">
                        <div class="flex items-center gap-1.5"><i class="fa-regular fa-clock text-slate-400 w-3"></i> ${store.openTime} - ${store.closeTime}</div>
                        <div class="flex items-center gap-1.5 truncate"><i class="fa-solid fa-location-dot text-slate-400 w-3"></i> ${store.address}</div>
                    </div>
                `;

                // Click Store Item to Fly to Map Location
                card.addEventListener('click', () => {
                    focusStoreOnMap(store);
                });

                listContainer.appendChild(card);
            });

            // Update Map Markers Visibility
            storesData.forEach(store => {
                const isVisible = filteredStores.some(s => s.id === store.id);
                if (markers[store.id]) {
                    if (isVisible) {
                        markers[store.id].addTo(map);
                    } else {
                        map.removeLayer(markers[store.id]);
                    }
                }
            });
        }

        function focusStoreOnMap(store) {
            map.flyTo([store.lat, store.lng], 16, {
                duration: 1.2
            });
            setTimeout(() => {
                if (markers[store.id]) {
                    markers[store.id].openPopup();
                }
            }, 1200);
        }

        window.onload = function() {
            initMap();
            renderCategoryChips();
            updateDisplay();

            // Search input listener
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                updateDisplay();
            });

            // Open only toggle listener
            document.getElementById('openOnlyToggle').addEventListener('change', (e) => {
                openOnlyFilter = e.target.checked;
                updateDisplay();
            });

            // Reset view button listener
            document.getElementById('resetViewBtn').addEventListener('click', () => {
                map.flyTo(KAOHSIUNG_CENTER, DEFAULT_ZOOM);
            });
        };
    </script>
</body>
</html>
